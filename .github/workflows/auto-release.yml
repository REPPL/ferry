name: auto-release

# On every push to the default branch, tag-and-release the NEWEST dated
# CHANGELOG version when it has no git tag yet — WITHOUT a PAT. A tag pushed with
# the built-in GITHUB_TOKEN deliberately does NOT re-trigger release.yml's
# tag-push event, so this workflow instead creates the tag and then invokes
# release.yml directly as a reusable workflow (the `release` job below). That
# keeps the whole publish path inside GitHub's own token model — no personal
# access token, no elevated secret.
#
# Only the NEWEST dated version is ever tagged: older CHANGELOG versions are left
# alone, because tagging them at the current HEAD would mis-point an immutable
# tag at the wrong code. Idempotent: when the newest version is already tagged AND
# its GitHub Release is published and complete, `detect` reports
# need_tag=need_release=false and nothing runs, so an ordinary (non-release) push
# to main does nothing. If the tag exists but its Release is MISSING OR
# INCOMPLETE — absent, still a draft, or short of its five assets, as a transient
# publish failure leaves it — `detect` sets need_release=true and re-invokes
# `release` ALONE — built from the tagged commit (release_ref), never the
# moved-on HEAD — so a flaky publish never permanently wedges the version.
on:
  push:
    branches: [main]

# Serialise: never let two auto-release runs race to create the same tag, and
# never cancel one mid-flight — a half-created tag or release is worse than a
# queued one.
concurrency:
  group: auto-release
  cancel-in-progress: false

# Floor for the workflow: read-only. Each job elevates itself to exactly the
# scopes it needs, and no more.
permissions:
  contents: read

jobs:
  # Decide whether the newest dated CHANGELOG version still needs a tag. Pure
  # read: no writes, no pushes, contents: read only.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # count prior release.yml attempts for the retry bound
    outputs:
      version: ${{ steps.detect.outputs.version }}
      need_tag: ${{ steps.detect.outputs.need_tag }}
      need_release: ${{ steps.detect.outputs.need_release }}
      release_ref: ${{ steps.detect.outputs.release_ref }}
    steps:
      - name: Check out the pushed commit (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 pulls every tag so the existence check below is
          # authoritative; a shallow clone would omit tags and mis-report.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect the newest CHANGELOG version needing a tag or a re-release
        id: detect
        # No ${{ }} interpolation in this run script (injection-safe, zizmor): it
        # reads CHANGELOG.md from the checkout, queries git + gh, and writes only
        # to $GITHUB_OUTPUT. GH_TOKEN arrives via env (not inline), so `gh release
        # view` can read the repo's releases under the floor `contents: read`.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The first heading of the form "## [X.Y.Z] - <date>" is the newest
          # dated release. Requiring the " - " date separator skips the
          # "## [Unreleased]" heading, which carries no date.
          version="$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - ' CHANGELOG.md \
            | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - .*/\1/' || true)"
          if [ -z "$version" ]; then
            echo "No dated CHANGELOG version found; nothing to release."
            echo "need_tag=false" >> "$GITHUB_OUTPUT"
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # The tag already exists, so it is NEVER moved (immutable). Re-release
            # ONLY when its GitHub Release is missing or incomplete: a transient
            # publish failure must not permanently wedge the version, and a
            # half-published one must not pass for done. Build the re-release FROM the
            # tagged commit, not the current (moved-on) main HEAD — resolve the tag
            # to its immutable commit SHA and hand it to release.yml as `ref`.
            echo "need_tag=false" >> "$GITHUB_OUTPUT"
            # "Released" means released AND complete, not merely present. A run
            # that dies part-way through publishing leaves a Release that EXISTS
            # — draft, or missing some of its assets — and a bare existence check
            # calls that done, so the version stays half-published while every
            # post-publish gate in release.yml is silently skipped. Require
            # isDraft=false and the full asset set: the four cross-compiled
            # binaries plus checksums.txt. The comparison is >= 5, not == 5, so
            # an asset attached by hand cannot make a complete release look
            # incomplete and re-release it on every subsequent push to main.
            #
            # Deliberate fail-open: ANY non-zero from `gh release view` (a true 404
            # or a transient rate-limit/auth blip), and any output that is not a
            # literal "true", counts as "Release missing or incomplete" and
            # re-releases. Safe — release.yml's publish step is idempotent: it
            # re-uploads the assets with --clobber and re-asserts the title,
            # notes, draft state and prerelease flag when the Release already
            # exists, so a false positive republishes the same bytes and re-runs
            # the post-publish gates instead of erroring. Parsing the error to
            # isolate a real 404 was rejected — it would hinge on gh's wording and
            # could misclassify a genuine missing-Release, re-wedging the very
            # failure this heals.
            released="$(gh release view "$tag" --json isDraft,assets \
              --jq '((.isDraft | not) and ((.assets | length) >= 5))' 2>/dev/null || true)"
            if [ "$released" = "true" ]; then
              echo "$tag is tagged and fully released; nothing to do."
              echo "need_release=false" >> "$GITHUB_OUTPUT"
            else
              commit="$(git rev-parse --verify "$tag^{commit}")"
              # Bound the retry: the re-release rebuilds the TAGGED commit, so a
              # DETERMINISTIC verify failure (as opposed to the transient publish
              # blip this healing exists for) would otherwise re-run the full
              # gate on every later main push, forever, and can never heal
              # forward. Three failed runs = stop retrying and say so loudly; a
              # fix requires the owner (deleting the tag or publishing by hand).
              #
              # Counting must look where the runs actually live: a CALLED
              # reusable workflow produces no run under release.yml's own runs
              # list (its jobs nest in the caller's run), so automated attempts
              # are counted as FAILED auto-release runs created since the tagged
              # commit — while this tag is the pending newest version, those are
              # exactly the failed re-release attempts (a push while healthy
              # yields a successful no-op run, and once a newer version is
              # promoted this branch is no longer taken for this tag).
              # Hand-pushed-tag attempts DO appear as standalone release.yml
              # runs carrying the tagged commit as head_sha, so both counts are
              # summed. An API failure counts as zero: fail-open to the healing
              # behaviour this workflow was built for.
              tag_time="$(git log -1 --format=%cI "$commit")"
              ar_fails="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/auto-release.yml/runs" \
                -f status=failure -f "created=>=$tag_time" -f per_page=100 \
                --jq '.workflow_runs | length' 2>/dev/null || true)"
              rl_fails="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
                -f status=failure -f per_page=100 \
                --jq "[.workflow_runs[] | select(.head_sha==\"$commit\")] | length" \
                2>/dev/null || true)"
              [ -n "$ar_fails" ] || ar_fails=0
              [ -n "$rl_fails" ] || rl_fails=0
              attempts=$((ar_fails + rl_fails))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::$tag is tagged but has no complete GitHub Release after $attempts failed release runs — NOT retrying again. The tagged commit fails the release gate deterministically; see docs/how-to/cutting-a-release.md (Manual / recovery flow)."
                echo "need_release=false" >> "$GITHUB_OUTPUT"
              else
                echo "$tag is tagged but has no complete GitHub Release ($attempts prior failed attempt(s)); re-releasing from $commit."
                echo "need_release=true" >> "$GITHUB_OUTPUT"
                echo "release_ref=$commit" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            # Pre-tag gate: the tag created below is immutable the moment it is
            # pushed, and release.yml's verify runs only AFTER it exists — but
            # its plan-doc shipped check is the one gate with no pre-tag
            # coverage anywhere (ci.yml does not run it). Run it here so a
            # promotion commit with an un-shipped plan Status: line fails THIS
            # job instead of burning the version number.
            scripts/check-plan-shipped.sh "$tag"
            echo "$tag has no git tag; will tag and release at github.sha."
            echo "need_tag=true" >> "$GITHUB_OUTPUT"
            echo "need_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Create and push the annotated tag with the GITHUB_TOKEN. This is the ONLY
  # push this automation makes, and it targets a NEW tag ref only — never a
  # branch. A GITHUB_TOKEN-pushed tag raises no tag-push event, which is why the
  # release below invokes release.yml explicitly rather than relying on the tag.
  tag:
    needs: detect
    if: needs.detect.outputs.need_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # push the new tag ref
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha = this main push's HEAD, the immutable commit to tag.
          ref: ${{ github.sha }}
          # persist-credentials: true is REQUIRED here so `git push` below
          # authenticates as the GITHUB_TOKEN. Scoped to this single tag-creating
          # job whose only step pushes one new tag ref; no other step runs, so
          # the persisted credential is never exposed to untrusted input.
          persist-credentials: true

      - name: Create and push the annotated tag at the released commit
        # Values arrive via env (no ${{ }} inside the script): injection-safe.
        env:
          TAG: v${{ needs.detect.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Annotated tag at github.sha — the exact commit this push built and the
          # commit release.yml will check out (github.sha) and ship.
          git tag -a "$TAG" -m "ferry $TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

  # Cut the release by calling release.yml as a reusable workflow. Because it is
  # CALLED (not triggered by the tag push), github.sha inside release.yml is this
  # run's HEAD = the commit just tagged, so both of release.yml's jobs check out
  # and ship exactly that commit — the same anti-tag-move property the tag-push
  # entry point has. A called workflow is capped by the caller's grants, so this
  # job hands down every scope release.yml's jobs need (contents/id-token/
  # attestations: write).
  release:
    needs: [detect, tag]
    # Run when a release is needed AND the tag is in place — either the tag job
    # just created it (success) or it already existed and was skipped. !cancelled()
    # is required because `tag` is skipped on the re-release path; a bare success()
    # would skip this job too. !cancelled() — not always(), matching the tripwire
    # convention in release.yml — still fires on a SKIPPED `tag` but NOT on a
    # cancelled run, so a manual cancel can never publish a half-finished state. A
    # FAILED tag job (result neither success nor skipped) blocks the release, so a
    # half-made tag never publishes.
    if: >-
      !cancelled()
      && needs.detect.outputs.need_release == 'true'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    permissions:
      contents: write        # release.yml: create the Release + verify the tag
      id-token: write        # release.yml: OIDC for build-provenance attestation
      attestations: write    # release.yml: publish + read back the attestations
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.detect.outputs.version }}
      # Empty on the fresh-tag path → release.yml falls back to github.sha (the
      # commit just tagged). The resolved tagged-commit SHA on the re-release
      # path, so the Release is built from the tag, not a newer main HEAD.
      ref: ${{ needs.detect.outputs.release_ref }}
