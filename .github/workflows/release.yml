name: release

# Pushing a version tag (vX.Y.Z) first re-runs the full verification gate
# (gofmt, CLI-reference staleness, consistency lint, build, vet, tests
# including the race leg, and the behavioural eval suite against real Linux
# AND macOS binaries) against the PUSHED COMMIT; only if that gate is
# green does it build the four cross-compiled binaries FROM THAT SAME COMMIT,
# generate a checksums.txt manifest over them, and publish a GitHub Release with
# the binaries, checksums.txt, and (on a public repo) their build-provenance
# attestations attached — attestation is skipped on a user-owned private repo,
# where GitHub does not offer the feature.
# Nothing is pushed to any branch: install.sh fetches checksums.txt from the
# release at install time, so no checksum is ever committed back. Both jobs check
# out `github.sha` — the commit the pushed tag pointed at, fixed for the whole run
# — never the tag NAME, which could be force-re-pointed between the jobs to swap
# unverified code into the release build. Net effect: a tag push produces a
# verified, ready-to-install release whose binaries, checksums, and reported
# version all come from the pushed commit — never the default-branch tip, never a
# moved tag.
on:
  push:
    tags:
      - 'v*'
  # Also callable as a reusable workflow: the auto-release workflow tags the
  # newest CHANGELOG version with the GITHUB_TOKEN (which, by design, does NOT
  # re-trigger the tag-push event above) and then invokes this workflow
  # explicitly, passing the tag it just created. Both entry points converge on
  # the same jobs below; only the tag NAME arrives differently (see TAG).
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      # Exact commit to build the release FROM. Defaults to github.sha (the
      # triggering commit). auto-release passes the tagged commit's RESOLVED SHA
      # when re-publishing a Release for an already-existing tag, so the Release
      # is built from the tagged commit — never a newer main HEAD that has moved
      # on. A resolved commit SHA (not a tag name) keeps the anti-tag-move
      # property: an immutable SHA cannot be re-pointed between checkout steps.
      # `tag` and `ref` are an unenforced caller CONTRACT — --verify-tag checks
      # only that the tag exists, not that it points at `ref`. The sole caller
      # (auto-release) binds them: ref = `git rev-parse "$tag^{commit}"`.
      ref:
        required: false
        type: string
        default: ''

# Never run two releases of the same tag concurrently, and never cancel a
# release mid-flight — a half-published release is worse than a queued one.
# Keyed on the TAG so both entry points converge: in a workflow_call run the
# github context is the CALLER's (ref = refs/heads/main), so a ref-keyed group
# would put a called release and a tag-push release of the SAME tag in
# different groups and let them race to `gh release create`. The expression
# mirrors the TAG derivation below (env is not available in `concurrency`).
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# The tag name this run releases, derived ONCE for both entry points:
#   - workflow_call: `inputs.tag` (the tag the auto-release workflow just made).
#   - push-tag:      `inputs` is empty, so this falls through to github.ref_name
#                    (the vX.Y.Z ref that triggered the run).
# Exported to every step as $TAG. Note this is only the tag NAME — neither job
# ever CHECKS OUT this name; both check out github.sha (see each checkout step),
# which is the immutable released commit for BOTH entry points:
#   - push-tag:      github.sha = the commit the pushed tag pointed at.
#   - workflow_call: github.sha = the caller's HEAD = the commit auto-release
#                    just tagged.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Floor for the workflow: read-only. The release job below elevates itself to
# contents: write only to create the Release and upload its assets; verify stays
# read-only. No job pushes to any branch.
permissions:
  contents: read

jobs:
  # Gate the release on the pushed commit. This mirrors ci.yml's checks — build,
  # vet, the full Go test suite, the race leg — plus the full behavioural eval
  # suite against a real Linux binary (the same steps as ci.yml's `evals-linux`
  # job). A red suite or a red eval here aborts before anything is built or
  # published.
  # Checked out at github.sha (the commit the pushed tag pointed at), NEVER the
  # default-branch tip or the re-resolvable tag name, so the gate exercises
  # exactly the commit whose binaries will ship.
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # $TAG later reaches `make build VERSION="$TAG"` in the release job, where
      # make re-expands it inside a double-quoted /bin/sh recipe — backticks in
      # a tag name would be command-substituted there, in a job holding write +
      # attestation permissions. Constrain the name once, at the gate's entry
      # point (git permits backticks in ref names; both tag-creating paths
      # already produce plain vX.Y.Z, so this only ever refuses a hand-crafted
      # hostile or mistyped tag). Prerelease/build suffixes stay allowed.
      - name: Tag name is a semver release tag
        env:
          VERSION: ${{ env.TAG }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "release: refusing tag '$VERSION' — not a vMAJOR.MINOR.PATCH[-prerelease] name" >&2
            exit 1
          fi

      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # inputs.ref when auto-release re-releases an existing tag (its resolved
          # tagged-commit SHA), else github.sha — the commit the pushed tag / this
          # run pointed at. Both are IMMUTABLE commit SHAs, never a tag NAME:
          # checkout re-resolves a named ref at each job's start, so a moved tag
          # could differ here, whereas a pinned SHA cannot.
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          # cache: false — this workflow is tag-triggered; module caching in a
          # release-triggering workflow is a cache-poisoning vector (zizmor).
          cache: false

      # The three cheap main-branch gates ci.yml runs that were previously
      # absent here — a hand-pushed tag never runs ci.yml (it triggers on
      # branches only), so without them a release could ship what the declared
      # gate set would have refused.
      - name: Format (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted (run gofmt -w .):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: CLI reference is current (docs/reference/cli)
        run: |
          set -euo pipefail
          make gen-docs
          status="$(git status --porcelain docs/reference/cli/)"
          if [ -n "$status" ]; then
            echo "docs/reference/cli is stale — run 'make gen-docs' and commit the result." >&2
            echo "$status" >&2
            git diff -- docs/reference/cli/ >&2 || true
            exit 1
          fi

      - name: Consistency lint (ADR numbering, memory split, refusal bodies)
        run: scripts/consistency-lint.sh

      - name: Plan-doc shipped check
        # Docs backstop for scripts/release.sh's local plan gate: if a
        # .abcd/development/plans/*<tag>.md plan exists, its Status: line must read
        # "shipped in <tag>"; a missing plan is fine (not every patch has one).
        # VERSION comes via env (not inlined into the run script) to keep the
        # tag ref out of the shell expansion (injection-safe, zizmor). $TAG is
        # the workflow-level env derived once for both entry points.
        env:
          VERSION: ${{ env.TAG }}
        run: scripts/check-plan-shipped.sh "$VERSION"

      - name: Build
        run: go build ./...

      # verify must gate what the release job will actually build: that job
      # runs `make build` (all four targets), not the host-only `go build ./...`
      # above, and by this point the tag is immutable — a target-specific break
      # caught only there would leave the version permanently unreleasable.
      - name: Cross-compile every release target (make build)
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race, internal)
        run: go test -race ./internal/...

      - name: Install strace (enables the AC-ssh-not-read strict leg on Linux)
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Build the Linux ferry binary
        run: go build -o "$RUNNER_TEMP/ferry" .

      # FERRY_CONFORMANCE=1 makes a missing install.sh a FAILURE (not a skip) for
      # the offline installer ACs, matching the final-conformance contract in
      # evals/README.
      - name: Run the full eval suite against the Linux binary
        run: FERRY_BIN="$RUNNER_TEMP/ferry" FERRY_INSTALL_SH="$PWD/install.sh" FERRY_CONFORMANCE=1 go test ./evals/...

      # Independent, gating cross-check of the "never reads ~/.ssh" promise: run a
      # non-doctor ferry command under strace and FAIL if it performs any
      # open/openat under ~/.ssh/. A second, script-level tripwire alongside the
      # in-Go strace leg above — a real syscall assertion, not a proxy.
      - name: strace tripwire — no ~/.ssh opens (AC-ssh-not-read)
        run: |
          set -euo pipefail
          SBOX="$RUNNER_TEMP/ssh-not-read-sandbox"
          mkdir -p "$SBOX/.ssh" "$SBOX/.config/ferry" "$SBOX/.local/state/ferry" "$SBOX/repo"
          # Seed a sentinel private key ferry must never open.
          printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\nSENTINELKEYMATERIAL\n-----END OPENSSH PRIVATE KEY-----\n' > "$SBOX/.ssh/id_ed25519"
          chmod 600 "$SBOX/.ssh/id_ed25519"
          # Minimal repo + machine config so a non-doctor command has scope to read.
          printf '[manage]\ndotfiles = [".zshrc"]\n' > "$SBOX/repo/ferry.toml"
          printf 'repo = "%s"\n' "$SBOX/repo" > "$SBOX/.config/ferry/config.toml"
          TRACE="$RUNNER_TEMP/ssh-not-read.strace"
          # -f follows a git subprocess too; status is a read-only non-doctor command.
          # ferry's own exit status is irrelevant here (|| true); the trace is the check.
          HOME="$SBOX" strace -f -e trace=open,openat -o "$TRACE" "$RUNNER_TEMP/ferry" status </dev/null || true
          # Harden against a silent no-op: if strace produced no trace at all (not
          # installed, crashed), the grep below would find nothing and pass falsely.
          # Require a non-empty trace so this tripwire can never green on a broken run.
          if [ ! -s "$TRACE" ]; then
            echo "AC-ssh-not-read: strace produced no trace — cannot verify; failing closed" >&2
            exit 1
          fi
          # FAIL if any open/openat line names a path under the sandbox ~/.ssh/.
          if grep -E 'open(at)?\(' "$TRACE" | grep -F "$SBOX/.ssh" ; then
            echo "AC-ssh-not-read: ferry opened a path under ~/.ssh/ (must never read it)" >&2
            exit 1
          fi
          echo "AC-ssh-not-read: no ~/.ssh opens observed under strace (status)."

  # The macOS leg of the release gate, mirroring ci.yml's macOS `check` steps
  # (vet/test/race) plus `evals-macos`: ferry is macOS-first, its case-fold and
  # symlink guards behave differently on APFS, and a hand-pushed tag never runs
  # ci.yml — without this leg a darwin-only regression (or a vet finding in a
  # darwin-only file, invisible to the Linux analysis set) would tag, attest,
  # and publish green.
  verify-macos:
    timeout-minutes: 30
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same immutable-SHA rule as verify: never a tag NAME.
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race, internal)
        run: go test -race ./internal/...

      - name: Build the macOS ferry binary
        run: go build -o "$RUNNER_TEMP/ferry" .

      # FERRY_CONFORMANCE=1 matches the Linux leg's contract: a missing
      # install.sh is a FAILURE (not a skip) for the offline installer ACs.
      - name: Run the full eval suite against the macOS binary
        run: FERRY_BIN="$RUNNER_TEMP/ferry" FERRY_INSTALL_SH="$PWD/install.sh" FERRY_CONFORMANCE=1 go test ./evals/...

  # Build and publish ONLY after both verify legs are green. Binaries are
  # cross-compiled from the same pushed commit (github.sha) that verify just
  # gated, so the shipped artefacts match the code that passed — even if the
  # tag has been re-pointed since verify started.
  release:
    needs: [verify, verify-macos]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Release and upload its assets (no branch push)
      id-token: write       # mint the OIDC token attest-build-provenance signs with
      attestations: write   # publish the build-provenance attestations (and let the
                            # post-release verify step read them back through gh)
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # inputs.ref (the re-release path's resolved tagged-commit SHA) or
          # github.sha (the commit the pushed tag pointed at) — an immutable SHA,
          # not the tag NAME and not the default-branch tip, so the binaries below
          # are built from the exact commit verify gated. Both jobs resolve the
          # SAME value, so verify and publish build the identical commit.
          ref: ${{ inputs.ref || github.sha }}
          # No job step pushes to any branch, so no git-stored credentials are
          # needed: gh uses GH_TOKEN, and the no-branch-commit tripwire reads the
          # default-branch ref through the API with GH_TOKEN, not git ls-remote.
          persist-credentials: false

      - name: Record the default-branch tip (no-branch-commit tripwire)
        # This release job must push NOTHING to any branch. Record the remote
        # default-branch tip now; the closing step re-reads it and fails the run
        # if the branch moved BECAUSE OF THIS JOB. Read the ref through the API
        # with GH_TOKEN: an anonymous `git ls-remote` cannot authenticate to this
        # private repo, and checkout runs with persist-credentials: false.
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')"
          test -n "$sha"
          echo "DEFAULT_BRANCH_START_SHA=$sha" >> "$GITHUB_ENV"
          echo "default-branch tip at job start: $sha"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Cross-compile the four binaries (version-stamped from the tag)
        # VERSION=$TAG stamps `ferry --version` via -ldflags. The binaries built
        # here are the ones checksummed, attested, and uploaded below, so the
        # manifest, the published assets, and the reported version are all in sync.
        run: make build VERSION="$TAG"

      - name: The stamped binary reports the tag
        # Go's linker silently ignores -X for a symbol that no longer exists, so a
        # rename/move of cmd.version would publish binaries reporting the -dev
        # version — with valid checksums and provenance over the wrong artifact —
        # and nothing else in this workflow would go red. Same assertion as the
        # recovery driver (scripts/release.sh); the runner is x64 Linux, so the
        # linux-amd64 binary is directly executable.
        run: |
          set -euo pipefail
          reported="$(./bin/ferry-linux-amd64 version)"
          if ! printf '%s' "$reported" | grep -qF "$TAG"; then
            echo "release: built binary reports '$reported', not '$TAG' — the version stamp is broken" >&2
            exit 1
          fi

      - name: Generate checksums.txt over the four binaries
        # Hash the exact binaries built above into a sha256sum-format manifest.
        # It is uploaded as a release asset; install.sh fetches it from the release
        # and verifies each download against it. No rebuild — the bytes hashed here
        # are the bytes uploaded below.
        run: scripts/gen-checksums.sh

      - name: Attest build provenance for the binaries and checksums.txt
        # Signed SLSA build-provenance for each cross-compiled binary AND the
        # checksums.txt manifest, over the exact files uploaded below. Runs BEFORE
        # the Release so a failed attestation aborts before anything is published.
        # install.sh does not consume these attestations (it verifies the binary
        # against checksums.txt); attesting checksums.txt makes the manifest a
        # first-class, provenance-signed artifact for anyone who verifies it with
        # `gh attestation verify`. Needs id-token: write (OIDC) and
        # attestations: write (the attestations store) from the job permissions.
        #
        # Skipped on a private repo: build-provenance attestation is not available
        # for user-owned private repositories (GitHub gates the feature by repo
        # visibility). The release still ships the binaries + checksums.txt, which
        # install.sh verifies by hash; attestation re-enables automatically if ferry
        # goes public. A skipped step is not a failure, so the publish steps below
        # still run.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            bin/ferry-*
            bin/checksums.txt

      # The release body is this version's CHANGELOG section — keyed on $TAG
      # specifically (never "newest dated heading": a hand-pushed tag for an
      # older version must not get another version's notes), matched with
      # literal index() so the dots in the version cannot act as regex. Fail
      # SOFT: an unextractable section publishes an empty body (the previous
      # behaviour) rather than blocking the one irreversible act — the
      # promotion flow already guarantees the dated section exists.
      - name: Extract this version's CHANGELOG section as the release notes
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v hdr="## [$ver] - " '
            index($0, hdr) == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "WARNING: no '## [$ver] - <date>' section in CHANGELOG.md; publishing empty notes." >&2
            : > "$notes"
          fi
          {
            echo
            echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md"
          } >> "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: Create the GitHub Release and upload the binaries + checksums.txt
        # The tag gate above deliberately admits a prerelease suffix, and both
        # prune-releases.sh and check-plan-shipped.sh skip cleanly so such a run
        # publishes green. Without --prerelease, though, GitHub marks the result a
        # full release, which makes it the repo's `latest` — the very URL
        # install.sh serves to every `curl … | bash` user. Flag it so a rehearsal
        # tag can never be handed out as the current version. Per SemVer the
        # prerelease is the part after `-` and BEFORE any `+`, so build metadata
        # is stripped first: the gate admits `+build` metadata, which may itself
        # contain a hyphen (`v1.2.3+2026-01-01`) and is not a prerelease. A plain
        # vX.Y.Z tag leaves the array empty, so the command is byte-identical to
        # a normal release's.
        run: |
          set -euo pipefail
          pre=()
          case "${TAG%%+*}" in
            *-*) pre=(--prerelease) ;;
          esac
          gh release create "$TAG" bin/ferry-* bin/checksums.txt \
            --verify-tag --title "$TAG" --notes-file "$NOTES_FILE" "${pre[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published attestation against a freshly downloaded binary
        # Post-release gate (plan W2 eval): prove the attestation is real and
        # retrievable. Download one binary FRESH from the just-created Release and run
        # `gh attestation verify` against this repo; a failure fails the whole run. gh
        # reads the release asset (contents: read, covered by contents: write) and the
        # attestation (attestations read, covered by attestations: write). Runs before
        # the prune so the release it verifies is guaranteed still present.
        #
        # Skipped on a private repo: no attestation was produced above, so there is
        # nothing to verify. Re-enables alongside attestation if ferry goes public.
        if: ${{ !github.event.repository.private }}
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/attest-verify"
          mkdir -p "$DL"
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'ferry-linux-amd64' \
            --dir "$DL"
          # --signer-workflow binds acceptance to an attestation SIGNED BY this
          # release workflow, not merely one from somewhere in this repo (--repo
          # alone accepts any workflow's attestation). Format is
          # [host/]<owner>/<repo>/<path>/<to>/<workflow>; GITHUB_REPOSITORY is
          # <owner>/<repo>.
          gh attestation verify "$DL/ferry-linux-amd64" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published assets against the published checksums.txt
        # Post-release gate for the pairing install.sh depends on: download the
        # manifest and every binary FRESH from the just-created Release and run
        # the same sha256 check install.sh performs. Unlike the attestation step
        # above this needs no repo-visibility feature, so it runs on private and
        # public repos alike — on a private repo it is the only post-publish
        # asset check. Runs before the prune so the release it verifies is
        # guaranteed still present.
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/checksums-verify"
          mkdir -p "$DL"
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'ferry-*' --pattern 'checksums.txt' \
            --dir "$DL"
          cd "$DL"
          sha256sum -c checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune superseded releases (retention policy)
        # Runs ONLY after the new release is published (a failed publish stops the job
        # before this step). Keeps the latest release of the current line plus the last
        # release of every other line, deleting older within-line RELEASES (never their
        # git tags, which are immutable once pushed). It never prunes the release just
        # created (--current), and refuses if a newer
        # patch than the current one somehow exists. See scripts/prune-releases.sh.
        run: scripts/prune-releases.sh --current "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert the release job pushed nothing to the default branch
        # Close the no-branch-commit tripwire opened at job start. Runs last so it
        # covers every preceding step, including the release create and prune.
        # !cancelled(): the tripwire must still run when an earlier step FAILED —
        # an abnormal run is exactly when an unexpected push most needs catching
        # (the default if: success() would silently skip it). Not always(), which
        # would also run on a cancelled job whose half-finished state proves
        # nothing.
        # If the tip is unchanged, done. If it moved, attribute: a push from this job
        # would use the GITHUB_TOKEN and land as github-actions[bot], so a bot
        # commit in the moved range fails the run, while an unrelated concurrent
        # human merge is logged and tolerated (this job did not cause it).
        # Honest scope: this proves no bot-identity commit reached the default
        # branch during the job; a future step that pushed under some other
        # explicitly-wired identity would be misattributed as external — but such
        # a step would also have to add credentials this job no longer has
        # (persist-credentials: false), which code review gates. If the range
        # lookup itself fails (e.g. the branch was force-pushed mid-run), set -e
        # fails the run — fail closed.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          end="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')"
          if [ "$end" = "${DEFAULT_BRANCH_START_SHA}" ]; then
            echo "default branch unchanged across the release job (${end}); the job pushed nothing."
            exit 0
          fi
          committers="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH_START_SHA}...${end}" \
            --jq '[.commits[].committer.login // "unknown"] | unique | join(" ")')"
          echo "default branch moved during the release job: ${DEFAULT_BRANCH_START_SHA} -> ${end} (committers: ${committers})"
          case " ${committers} " in
            *" github-actions[bot] "*)
              echo "a github-actions[bot] commit landed on the default branch during this job — the release workflow must never push to a branch" >&2
              exit 1
              ;;
          esac
          echo "movement attributed to commits outside this job; the release job itself pushed nothing."
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
